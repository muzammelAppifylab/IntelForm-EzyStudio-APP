name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the GITHUB_TOKEN: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One Postgres service per job, so every CI run gets its own databases:
#   intelform_ci       migrated + seeded by the steps below
#   intelform_ci_tpl   + intelform_ci_t_*  server tests (server/test/harness.ts: template DB, one DB per test file)
#   intelform_e2e      dropped and recreated by Playwright's web server (server/test/e2e-global-setup.ts)
env:
  APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: intelform
          POSTGRES_PASSWORD: intelform
          POSTGRES_DB: intelform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intelform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://intelform:intelform@localhost:5432/intelform_ci
      TEST_DATABASE_URL: postgres://intelform:intelform@localhost:5432/intelform_ci
      E2E_DATABASE_URL: postgres://intelform:intelform@localhost:5432/intelform_e2e
      E2E_PORT: '8793'
      APP_URL: http://localhost:8793
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Migrate
        run: npm run db:migrate
      - name: Seed
        run: npm run db:seed
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget (/f/* entry, 120 KB gzip)
        run: npx tsx e2e/helpers/bundle-size.ts
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end (all specs; retries 1, traces on failure)
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

